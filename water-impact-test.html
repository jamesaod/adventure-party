</style></head><body><header><h1>Giant water impact</h1><a href="index.html">Back to game</a></header><main><section><div id="viewport"><canvas id="view" aria-label="Interactive stream splash test"></canvas><div id="stats">Loading…</div></div><p>Click anywhere on the stream to splash there. The timed strike uses the game's 2.4-second impact delay.</p><p class="small">Uses the combat water renderer and splash effect. This focused test has no actors or AI.</p><p id="error" role="alert"></p></section><aside><button id="splash" disabled>Splash now</button><button id="strike" disabled>Timed club strike</button><label><input id="repeat" type="checkbox"> Repeat every 4 seconds</label><label>Impact location<select id="location"><option value="water">Middle of stream</option><option value="dry">Dry ground — no splash</option></select></label><label>Zoom <output id="zoomValue">150%</output><input id="zoom" type="range" min="75" max="250" value="150" step="5"></label><button id="clear">Clear effects</button><p id="status" role="status">Preparing the stream…</p></aside></main><script type="module" src="js/water-impact-test.mjs?v=2"></script></body></html>
