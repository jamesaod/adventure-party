import * as THREE from "../assets/vendor/three/three.module.min.js";
function randomFor(seed){
  let state=seed;
  return ()=>((state=Math.imul(1664525,state)+1013904223|0)>>>0)/4294967296;
}
function growOak(seed){
  const random=randomFor(seed);
  const nodes=[{x:0,y:0,z:0,parent:-1},{x:0,y:0,z:20,parent:0},{x:1,y:0,z:33,parent:1}];
  const targets=[];
  while(targets.length<230){
    const x=random()*2-1,y=random()*2-1,z=random()*2-1;
    if(x*x+y*y+z*z<1)targets.push({x:x*43,y:y*38,z:61+z*27});
  }
  let active=targets;
  for(let step=0;step<37&&active.length;step++){
    const directions=new Map();
    active=active.filter(target=>{
      let closest=-1,distance=29;
      for(let i=2;i<nodes.length;i++){
        const node=nodes[i],d=Math.hypot(target.x-node.x,target.y-node.y,target.z-node.z);
        if(d<distance){closest=i;distance=d;}
      }
      if(distance<5)return false;
      if(closest>=0){
        const node=nodes[closest];
        const sum=directions.get(closest)||{x:0,y:0,z:.12};
        sum.x+=(target.x-node.x)/distance;
        sum.y+=(target.y-node.y)/distance;
        sum.z+=(target.z-node.z)/distance;
        directions.set(closest,sum);
      }
      return true;
    });
    for(const [parent,v] of directions){
      const d=Math.hypot(v.x,v.y,v.z);
      if(d<.001)continue;
      const p=nodes[parent];
      nodes.push({x:p.x+v.x/d*4,y:p.y+v.y/d*4,z:p.z+v.z/d*4,parent});
    }
  }
  const mass=nodes.map(()=>1), leaves=[];
  for(let i=nodes.length-1;i>0;i--)mass[nodes[i].parent]+=mass[i];
  for(let i=3;i<nodes.length;i++){
    if(mass[i]>7)continue;
    const p=nodes[i];
    for(let j=0;j<4;j++){
      const phase=i*2.39996+j*Math.PI;
      const reach=2+random()*5;
      leaves.push({x:p.x+Math.cos(phase)*reach,y:p.y+Math.sin(phase)*reach,
        z:p.z+(random()-.5)*8,r:2+random()*3,color:Math.floor(random()*5)});
    }
  }
  return {nodes,mass,leaves};
}

const hardwoodProfiles={
  redMaple:{base:24,spacing:4,tiers:10,width:29,rise:.40,paired:true,hue:.015,bark:0xb8ada8},
  blackCherry:{base:34,spacing:5,tiers:8,width:20,rise:.49,paired:false,hue:.27,bark:0x74635e},
  sugarMaple:{base:26,spacing:4,tiers:10,width:34,rise:.44,paired:true,hue:.095,bark:0xa89b8c},
  tulipTree:{base:43,spacing:5,tiers:9,width:23,rise:.42,paired:false,hue:.25,bark:0xa49b83},
  whiteAsh:{base:32,spacing:5,tiers:8,width:24,rise:.57,paired:true,hue:.22,bark:0xaaa598}
};
function growSpecies(seed,species){
  const hardwood=hardwoodProfiles[species];
  const random=randomFor(seed);
  const hemlock=species==="hemlock", elm=species==="elm", swamp=species==="baldCypress";
  const pine=species==="pine"||hemlock, apple=species==="apple";
  const forkHeight=hardwood?.base??(elm?(seed%2?20:38):apple?13:25);
  const nodes=[{x:0,y:0,z:0,parent:-1}],leaves=[];
  function add(parent,x,y,z){
    return nodes.push({parent,x,y,z})-1;
  }
  add(0,0,0,apple?7:12);
  let leader=add(1,0,0,forkHeight);
  const tiers=hardwood?.tiers??(elm?1:apple?5:pine?8:12);
  for(let tier=0;tier<tiers;tier++){
    const progress=tier/tiers;
    const height=forkHeight+tier*(hardwood?.spacing??(apple?2.8:pine?6:4));
    leader=add(leader,0,0,height+.2);
    const count=hardwood?(hardwood.paired?2:1):elm?5:pine?3+Math.floor(random()*4):apple?3:1+Math.floor(random()*2);
    const phase=tier*2.39996;
    for(let branch=0;branch<count;branch++){
      const angle=phase+branch*Math.PI*2/count+(random()-.5)*.55;
      const reach=hardwood
        ? hardwood.width*Math.sin(Math.PI*(.18+.77*progress))*(.8+random()*.35)
        : apple?28*Math.sin(Math.PI*(.24+.70*progress))*(.82+random()*.32)
        : (elm?(forkHeight===20?36:23):pine?32:swamp?26:24)*(1-progress*(pine?.88:.65))*(.7+random()*.5);
      const rise=hardwood?reach*hardwood.rise:elm?reach*.95:hemlock?reach*-.08:apple?reach*.34:pine?reach*.1:reach*.34;
      const x=Math.cos(angle)*reach,y=Math.sin(angle)*reach;
      const middle=add(leader,x*.48,y*.48,height+rise*.35);
      const tip=add(middle,x,y,height+rise);
      for(let shoot=0;shoot<8;shoot++){
        const t=elm?.56+shoot*.062:.38+shoot*.085;
        const bearing=angle+(shoot%2?1:-1)*(.6+random()*.45);
        const length=(pine?5:apple?8:6)*(1-progress*.55);
        const sx=x*t+Math.cos(bearing)*length,sy=y*t+Math.sin(bearing)*length;
        const sz=height+rise*t+length*(elm?.85:hemlock?-.65:pine?.18:.42);
        const parent=t<.66?middle:tip;
        add(parent,sx,sy,sz);
        const origin=nodes[parent];
        for(let j=0;j<12;j++){
          const spread=elm?9:pine?3:apple?6:4;
          const along=apple?.32+.68*j/11:1;
          leaves.push({x:origin.x+(sx-origin.x)*along+(random()-.5)*spread,y:origin.y+(sy-origin.y)*along+(random()-.5)*spread,
            z:origin.z+(sz-origin.z)*along+(random()-.5)*spread,r:(apple?1.05:pine?1.6:1.8)+random(),
            color:Math.floor(random()*5),apple:apple&&j===0&&shoot%3===0});
        }
      }
    }
  }
  const mass=nodes.map(()=>1);
  for(let i=nodes.length-1;i>0;i--)mass[nodes[i].parent]+=mass[i];
  return {nodes,mass,leaves,species};
}
function growFullOak(seed,species="oak"){
  if(hardwoodProfiles[species]||["pine","apple","birch","elm","hemlock","baldCypress"].includes(species))return growSpecies(seed,species);
  const oak=growOak(seed), random=randomFor(seed+88000);
  oak.leaves=oak.leaves.flatMap(leaf=>[leaf,{
    ...leaf,x:leaf.x+(random()-.5)*9,
    y:leaf.y+(random()-.5)*9,z:leaf.z+(random()-.5)*7
  }]);
  oak.species=species;
  if(species==="cypress"){
    for(const point of [...oak.nodes,...oak.leaves]){
      point.x*=.34;
      point.y*=.34;
      point.z*=1.45;
    }
  }
  if(species==="willow"){
    const strands=[];
    for(const [i,leaf] of oak.leaves.entries()){
      if(i%3!==0)continue;
      const length=12+random()*27;
      for(let j=0;j<5;j++){
        strands.push({...leaf,z:Math.max(5,leaf.z-length*j/4),
          x:leaf.x+j*leaf.x*.023,y:leaf.y+j*leaf.y*.023,r:leaf.r*.77});
      }
    }
    oak.leaves=strands;
  }
  if(species==="snag"){
    oak.leaves=[];
    oak.nodes=oak.nodes.filter((node,i)=>i<3||oak.mass[i]>12)
      .map((node,i,kept)=>({...node,parent:kept.indexOf(oak.nodes[node.parent])}));
    oak.mass=oak.nodes.map(()=>1);
    for(let i=oak.nodes.length-1;i>0;i--)oak.mass[oak.nodes[i].parent]+=oak.mass[i];
  }
  oak.shadows=new Map();
  return oak;
}

function updateLeafAngle(){
  const angle=Number(leafAngle.value)*Math.PI/180;
  const sine=Math.sin(angle),cosine=Math.cos(angle);
  for(const {mesh,vertices:leafVertices,flatZ} of leafMeshes){
  for(let i=0;i<leafVertices.count;i++){
    const distance=1-flatZ[i];
    leafVertices.setY(i,-distance*sine);
    leafVertices.setZ(i,1-distance*cosine);
  }
  mesh.computeVertexNormals();
  leafVertices.needsUpdate=true;
  }

function buildTree(mature,seed=113,species="oak",sapling=false){
  if(!speciesBark.has(species)){
    const material=bark.clone();
    material.color.set(hardwoodProfiles[species]?.bark??barkTints[species]??0xffffff);
    if(species==="birch")material.color.multiplyScalar(2.25);
    speciesBark.set(species,material);
  }
  const woodMaterial=speciesBark.get(species);
  const oak=growFullOak(seed,species);
  if(species==="elm"){
    const random=randomFor(seed+193);
    for(let i=oak.leaves.length-1;i>0;i--){
      const j=Math.floor(random()*(i+1));

    for(const p of oak.leaves){

      const spread=1.48+.23*Math.cos(angle*5+.6)+.12*Math.sin(angle*3);

  const trunkPositions=[],trunkUV=[],trunkIndices=[];
  const rings=[[0,5.5,1],[1.4,5.1,.72],[4,4.3,.34],[8,3.6,.09],[13,3.05,0],[20,2.65,0],[27,2.34,0],[33,2.05,0]];
  if(mature)rings.push([39,1.72,0],[46,1.05,0],[52,.35,0],[54,.04,0]);
  else rings.push([37,1.72,0],[41,1.12,0],[45,.48,0],[48,.04,0]);
  const trunkProfiles={

  const profile=trunkProfiles[species]??{width:1,flare:1,bend:1};

    apple:[[0,3.8,.22],[2,3.45,.08],[8,3.15,0],[15,2.6,0],[22,1.7,0],[32,.12,0]],
    elm:[[0,4.6,.65],[3,4.1,.22],[8,3.6,0],[elmFork-5,3.05,0],[elmFork,2.6,0],[elmFork+3,.1,0]],
    tulipTree:[[0,5,.3],[3,4.5,.08],[12,4.1,0],[27,3.65,0],[43,3.2,0],[58,2.35,0],[72,1.4,0],[84,.08,0]],
    baldCypress:[[0,7,1],[2,6.1,.84],[5,4.75,.58],[10,3.3,.21],[16,2.65,.05],[25,2.25,0],[43,1.55,0],[63,.6,0],[72,.07,0]]
  };
  const trunkRings=speciesRings[species]??rings;
  const sides=72;
  for(const [height,radius,flare] of trunkRings){
    for(let i=0;i<=sides;i++){
      const angle=(i%sides)*2*Math.PI/sides;
      const roots=rootAngles.reduce((sum,root)=>sum+Math.max(0,Math.cos(angle-root.angle))**26*root.reach,0);
      const r=sapling
        ? Math.min(radius,.9)+flare*roots*.012+.025*Math.sin(angle*11)
        : radius+flare*roots*(mature?.72:profile.flare)+.19*Math.sin(angle*11)+.12*Math.cos(angle*17);
      const heightFraction=Math.min(1,height/33);
      const bendWeight=Math.sin(Math.PI*heightFraction);
      const width=(mature?1.4:profile.width)*trunkWidth*(1+taperVariation*(1-heightFraction));
      trunkPositions.push(Math.cos(angle)*r*width+bendX*bendWeight+(mature?-height*.075:height/33*profile.bend),height*(mature?.82:species==="apple"?.82:species==="cypress"?1.45:species==="birch"||species==="pine"?1.18:1),Math.sin(angle)*r*width+bendZ*bendWeight);
      trunkUV.push(i/sides,height/33);
    }
  }
  for(let row=0;row<trunkRings.length-1;row++)for(let i=0;i<sides;i++){
    const a=row*(sides+1)+i,b=a+sides+1;
    trunkIndices.push(a,b,a+1,a+1,b,b+1);
  }
  const trunkGeometry=new THREE.BufferGeometry();
  trunkGeometry.setAttribute("position",new THREE.Float32BufferAttribute(trunkPositions,3));
  trunkGeometry.setAttribute("uv",new THREE.Float32BufferAttribute(trunkUV,2));
  trunkGeometry.setIndex(trunkIndices);
  trunkGeometry.computeVertexNormals();
  const normals=trunkGeometry.attributes.normal;
  for(let row=0;row<trunkRings.length;row++){
    const first=row*(sides+1),last=first+sides;
    const normal=new THREE.Vector3().fromBufferAttribute(normals,first)
      .add(new THREE.Vector3().fromBufferAttribute(normals,last)).normalize();
    for(const i of [first,last])normals.setXYZ(i,normal.x,normal.y,normal.z);
  }
  const trunk=new THREE.Mesh(trunkGeometry,woodMaterial);
  trunk.castShadow=trunk.receiveShadow=true;
  group.add(trunk);
  if(species==="baldCypress"&&!sapling){
    const kneeRandom=randomFor(seed+921);
    for(let i=0;i<9;i++){
      const angle=i*2.39996+kneeRandom()*.6;
      const radius=8+kneeRandom()*16;
      const x=Math.cos(angle)*radius,y=Math.sin(angle)*radius;
      wood({x,y,z:-.15},{x:x+.2,y,z:1.3+kneeRandom()*3.5},.95,.12);
    }
  }
  if(mature){
    for(let i=0;i<5;i++){
      const angle=.4+i*Math.PI*2/5;
      const base={x:-1,y:0,z:13};
      const shoulder={x:-1.3+Math.cos(angle)*2,y:Math.sin(angle)*2,z:19+i*.7};
      const elbow={x:Math.cos(angle)*19,y:Math.sin(angle)*19,z:23+(i%2)*3};
      const end={x:Math.cos(angle)*39,y:Math.sin(angle)*39,z:30+(i%3)*4};
      const curve=new THREE.CatmullRomCurve3([base,shoulder,elbow,end].map(p=>new THREE.Vector3(p.x,p.z,p.y)));
      const steps=18,sides=12;
      const tube=new THREE.TubeGeometry(curve,steps,1,sides,false);
      const positions=tube.attributes.position;
      for(let step=0;step<=steps;step++){
        const t=step/steps,center=curve.getPointAt(t);
        const radius=2.7*Math.pow(1-t,1.35)+.25;
        for(let side=0;side<=sides;side++){
          const index=step*(sides+1)+side;
          const point=new THREE.Vector3().fromBufferAttribute(positions,index).sub(center).multiplyScalar(radius).add(center);
          positions.setXYZ(index,point.x,point.y,point.z);
        }
      }
      tube.computeVertexNormals();
      const limb=new THREE.Mesh(tube,woodMaterial);
      limb.castShadow=limb.receiveShadow=true;
      group.add(limb);
    }
  }
  const baselineCount=oak.leaves.length;
  const scatter=randomFor(7231);
  for(let i=0;baselineCount&&i<Math.max(sapling?0:baselineCount*2,(sapling?1080:grove?13500:4500)-baselineCount);i++){
    const leaf=oak.leaves[i%baselineCount];
    oak.leaves.push({...leaf,x:leaf.x+(scatter()-.5)*4,y:leaf.y+(scatter()-.5)*4,z:leaf.z+(scatter()-.5)*4});
  }
  const leaves=new THREE.InstancedMesh(hardwoodGeometry[species]??geometry,foliageMaterial,oak.leaves.length);
  leaves.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  leaves.frustumCulled=false;
  for(const [i,p] of oak.leaves.entries()){
    const outer=Math.min(1,Math.hypot(p.x,p.y,(p.z-38)*.8)/58);
    const color=mature?new THREE.Color().setHSL(.28-.035*outer,.62,.095+.12*outer+p.color*.012):
      new THREE.Color().setHSL(.267+p.color*.006,.57,.135+p.color*.021);
    const hardwood=hardwoodProfiles[species];
    if(hardwood)color.setHSL(hardwood.hue+p.color*.006,.65,.19+p.color*.025);
    if(species==="maple")color.setHSL(.045+p.color*.018,.76,.35+p.color*.055);
    leaves.setColorAt(i,color);
  }
  leaves.castShadow=leaves.receiveShadow=true;
  group.add(leaves);
  const cards=new THREE.InstancedMesh(cardGeometry,cardMaterial,Math.ceil(oak.leaves.length/leavesPerCard));
  cards.castShadow=cards.receiveShadow=true;
  cards.frustumCulled=false;
  cards.visible=false;
  const color=new THREE.Color();
  for(let i=0;i<cards.count;i++){
    leaves.getColorAt(i*leavesPerCard,color);
    cards.setColorAt(i,color);
  }
  group.add(cards);
  const fruit=sapling?[]:oak.leaves.slice(0,baselineCount).filter(leaf=>leaf.apple);
  if(fruit.length){
    const apples=new THREE.InstancedMesh(new THREE.SphereGeometry(.48,8,6),
      new THREE.MeshStandardMaterial({color:0xb12618}),fruit.length);
    for(const [i,leaf] of fruit.entries()){
      apples.setMatrixAt(i,new THREE.Matrix4().makeTranslation(leaf.x,leaf.z-.55,leaf.y));
    }
    apples.castShadow=apples.receiveShadow=true;
    group.add(apples);
  }
  scene.add(group);
  return {seed,oak,group,leaves,cards,mature,baselineCount,baseColors:leaves.instanceColor?.array.slice()};
}
const saplings=[];
const trees=grove?[]:[buildTree(false),buildTree(true)];
const leafCount=document.getElementById("leafCount");
const leafSize=document.getElementById("leafSize");
const leafTotal=document.getElementById("leafTotal");
const leafScale=document.getElementById("leafScale");
const stackShadows=document.querySelector("#stackShadows");
if(grove){
  document.querySelector("#groveLink").hidden=true;
  document.querySelector("#stackControl").hidden=false;
  stackShadows.addEventListener("input",()=>{
    if(stackShadows.checked)shadows.checked=true;
  });
  shadows.addEventListener("input",()=>{
    if(!shadows.checked)stackShadows.checked=false;
  });
  const species=document.querySelector("#species");
  document.querySelector("#speciesControl").hidden=false;
  species.value=groveParams.get("species")??"oak";
  if(!species.value)species.value="oak";
  document.querySelector("#comparisonLabels").textContent=species.selectedOptions[0].text+" grove · combat terrain preview";
  viewpoint.value=groveParams.get("view")??"combat";
  orbit.value=groveParams.get("camera")??orbit.defaultValue;
  sun.value=groveParams.get("sun")??sun.defaultValue;
  leafSize.value=groveParams.get("size")??105;
  leafAngle.value=groveParams.get("angle")??26;
  updateLeafAngle();
  leafCount.value=groveParams.get("density")??100;
  shadows.checked=groveParams.get("shadows")!=="0";
  stackShadows.checked=groveParams.get("stack")==="1";
  const randomizeGrove=document.querySelector("#randomizeGrove");
  randomizeGrove.hidden=false;
  randomizeGrove.addEventListener("click",()=>{
    const seed=crypto.getRandomValues(new Uint32Array(1))[0];
    groveParams.set("seed",seed);
    reloadGrove();
  });
  species.addEventListener("change",reloadGrove);
  document.querySelector("#layoutControls").hidden=false;
  const treeDensity=document.querySelector("#treeDensity");
  const clearingSize=document.querySelector("#clearingSize");
  for(const control of [treeDensity,clearingSize]){
    control.value=groveParams.get(control.id)??control.defaultValue;
    const output=document.getElementById(control.id+"Value");
    output.value=control.value+"%";
    control.addEventListener("input",()=>output.value=control.value+"%");
    control.addEventListener("change",reloadGrove);
  }
  function reloadGrove(){
    groveParams.set("species",species.value);
    groveParams.set("foliage",foliageMode.value);
    groveParams.set("treeDensity",treeDensity.value);
    groveParams.set("clearingSize",clearingSize.value);
    groveParams.set("camera",orbit.value);
    groveParams.set("sun",sun.value);
    groveParams.set("view",viewpoint.value);
    groveParams.set("size",leafSize.value);
    groveParams.set("angle",leafAngle.value);
    groveParams.set("density",leafCount.value);
    groveParams.set("shadows",Number(shadows.checked));
    groveParams.set("stack",Number(stackShadows.checked));
    location.search=groveParams.toString();
  }
  const grass=new THREE.TextureLoader().load("../assets/textures/exploration/grass-short-v1.png",()=>draw());
  grass.colorSpace=THREE.SRGBColorSpace;
  grass.wrapS=grass.wrapT=THREE.RepeatWrapping;
  grass.repeat.set(48,48);
  ground.material.color.set(0xffffff);
  ground.material.map=grass;
  const seed=Number(groveParams.get("seed")??4500);
  const random=randomFor(seed);
  const scatterRandom=randomFor(seed+73);
  const types=Array.from(species.options,option=>option.value).filter(type=>type!=="mixed");
  for(let i=types.length-1;i>0;i--){
    const j=Math.floor(random()*(i+1));
    [types[i],types[j]]=[types[j],types[i]];
  }
  const lines=[];
  const hexRadius=32;
  const candidates=[];
  const layoutRandom=randomFor(seed+119);
  const clearings=Array.from({length:3},()=>({
    x:(layoutRandom()-.5)*300,z:(layoutRandom()-.5)*240
  }));
  const clearingRadius=Number(clearingSize.value)*.85;
  for(let row=-5;row<=5;row++)for(let col=-7;col<=7;col++){
    const x=Math.sqrt(3)*hexRadius*(col+row/2),z=1.5*hexRadius*row;
    for(let side=0;side<6;side++){
      for(const corner of [side,side+1]){
        const angle=Math.PI/6+corner*Math.PI/3;
        lines.push(x+hexRadius*Math.cos(angle),.05,z+hexRadius*Math.sin(angle));
      }
    }
    if(Math.hypot(x,z)<235&&clearings.every(gap=>Math.hypot(x-gap.x,z-gap.z)>=clearingRadius)){
      candidates.push({x,z,order:layoutRandom()});
    }
  }
  candidates.sort((a,b)=>a.order-b.order);
  const treeCount=Math.round(Number(treeDensity.value)*.24);
  for(const {x,z} of candidates.slice(0,treeCount)){
      const kind=species.value==="mixed"?types[trees.length%types.length]:species.value;
      const tree=buildTree(false,Math.floor(random()*100000)+1,kind);
      tree.group.position.set(x+(random()-.5)*10,0,z+(random()-.5)*10);
      tree.group.scale.setScalar((.72+random()*.23)*(kind==="apple"?1.30:1));
      trees.push(tree);
      if(kind!=="snag"){
        const sapling=buildTree(false,Math.floor(scatterRandom()*100000)+1,kind,true);
        const angle=scatterRandom()*Math.PI*2;
        sapling.group.position.set(x+18*Math.cos(angle),0,z+18*Math.sin(angle));
        sapling.group.scale.setScalar(.16+scatterRandom()*.11);
        sapling.sapling=true;
        saplings.push(sapling);
      }
  }
  trees.push(...saplings);
  const grid=new THREE.BufferGeometry();
  grid.setAttribute("position",new THREE.Float32BufferAttribute(lines,3));
  scene.add(new THREE.LineSegments(grid,new THREE.LineBasicMaterial({color:0x394429,transparent:true,opacity:.45})));
  Object.assign(camera,{left:-240,right:240,top:110,bottom:-110});
  camera.updateProjectionMatrix();
}
let canopyShaded=false;
function draw(time=0){
  const density=Number(leafCount.value)/100;
  const size=Number(leafSize.value)/100;
  leafTotal.textContent=(grove?trees.slice(0,1):trees).map(tree=>Math.round((grove&&tree.baselineCount?4500:tree.baselineCount)*density).toLocaleString()).join(" / ");
  leafScale.textContent=leafSize.value+"%";
  const heading=Number(orbit.value)*Math.PI/180;
  camera.position.set(202*Math.sin(heading),viewpoint.value==="ground"?61:120,202*Math.cos(heading));
  camera.lookAt(0,34,0);
  const strength=Number(wind.value)/100;
  const a=Number(sun.value)*Math.PI/180;
  light.position.set(115*Math.cos(a),115,115*Math.sin(a));
  renderer.shadowMap.enabled=shadows.checked;
  const useCards=foliageMode.value==="cards";
  const stackCanopy=!useCards&&grove&&shadows.checked&&stackShadows.checked;
  const canopyRays=new Map();
  const sampleWidth=Math.max(.3,size*1.4);
  for(const [panel,tree] of trees.entries()){
    const {oak,leaves,cards,mature,baselineCount}=tree;
    leaves.count=Math.min(oak.leaves.length,Math.round((tree.sapling?360:grove?4500:baselineCount)*density));
    leaves.visible=!useCards;
    cards.visible=useCards;
    cards.count=Math.ceil(leaves.count/leavesPerCard);
    const step=useCards?leavesPerCard:1;
    for(let slot=0;slot<leaves.count;slot+=step){
      const i=slot;
      const p=oak.leaves[i];

      const gust=Math.sin(time*2+p.y*.085)*strength;
      const trunkX=mature?-p.z*.075/.82:p.z/33;
      const outward=Math.atan2(trunkX-p.x,-p.y);
      dummy.position.set(p.x+gust*2,p.z+gust*.7,p.y);
      dummy.rotation.set(gust*.035,outward,0,"YXZ");
      const leafWidth=["pine","hemlock","baldCypress"].includes(oak.species)?.12:.72;
      dummy.scale.set(p.r*leafWidth*size,p.r*size,p.r*size);
      dummy.updateMatrix();
      if(useCards){
        dummy.rotation.x+=Number(leafAngle.value)*Math.PI/180+Math.sin(i)*.28;
        dummy.scale.set(size,size,size);
        dummy.updateMatrix();
        cards.setMatrixAt(i/leavesPerCard,dummy.matrix);
      }else{
        leaves.setMatrixAt(slot,dummy.matrix);
      }
      if(stackCanopy){
        const scale=tree.group.scale.x;
        const height=dummy.position.y*scale;
        const x=dummy.position.x*scale+tree.group.position.x;
        const z=dummy.position.z*scale+tree.group.position.z;
        const u=Math.floor((x-height*Math.cos(a))/sampleWidth);
        const v=Math.floor((z-height*Math.sin(a))/sampleWidth);
        const key=u+","+v;
        if(!canopyRays.has(key))canopyRays.set(key,[]);
        canopyRays.get(key).push({tree,i,height});
      }
    }
    if(useCards)cards.instanceMatrix.needsUpdate=true;
    else leaves.instanceMatrix.needsUpdate=true;
    if(grove)continue;
    for(const other of trees)other.group.visible=other===tree;
    renderer.setViewport(panel*480,0,480,440);
    renderer.setScissor(panel*480,0,480,440);
    renderer.render(scene,camera);
  }
  if(grove){
    if(stackCanopy||canopyShaded){
      for(const tree of trees)tree.leaves.instanceColor?.array.set(tree.baseColors);
      for(const ray of canopyRays.values()){
        ray.sort((a,b)=>b.height-a.height);
        for(const [layers,{tree,i}] of ray.entries()){
          const colors=tree.leaves.instanceColor.array;
          const shade=Math.max(.35,.9**layers);
          for(let channel=0;channel<3;channel++)colors[i*3+channel]*=shade;
        }
      }
      for(const tree of trees)if(tree.leaves.instanceColor)tree.leaves.instanceColor.needsUpdate=true;
      canopyShaded=stackCanopy;
    }
    renderer.setViewport(0,0,960,440);
    renderer.setScissor(0,0,960,440);
    renderer.render(scene,camera);
  }
}
for(const control of [sun,viewpoint,shadows,orbit,wind,leafCount,leafSize,stackShadows,foliageMode])control.addEventListener("input",()=>draw());
let running=false,animation;
play.addEventListener("click",()=>{
  running=!running;
  play.textContent=running?"Pause":"Animate";
  if(!running){cancelAnimationFrame(animation);return;}
  const start=performance.now();
  function tick(now){
    const elapsed=(now-start)/1000;
    sun.value=(55+elapsed*24)%360;
    draw(elapsed);
    animation=requestAnimationFrame(tick);
  }
  animation=requestAnimationFrame(tick);
});
draw();
</script></html>
