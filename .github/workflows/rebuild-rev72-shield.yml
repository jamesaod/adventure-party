name: Rebuild Rev 71 wooden shield asset

on:
  push:
    branches:
      - fix/rev72-original-wooden-shield
    paths:
      - ".rev72-transfer/READY"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rev72-original-wooden-shield
          fetch-depth: 0

      - name: Rebuild verified GLB from original mesh bytes
        shell: bash
        run: |
          set -euo pipefail
          cat .rev72-transfer/geometry-*.part > /tmp/geometry.xz.b64
          base64 --decode /tmp/geometry.xz.b64 > /tmp/geometry.xz
          xz --decompress --stdout /tmp/geometry.xz > /tmp/geometry.bin
          echo "bbdbf940fd629311ddd5fbb7224256c2cd963ec49141abf5e29a4e89ec2806c9  /tmp/geometry.bin" | sha256sum -c -
          python - <<'PY'
          import base64, hashlib, json, struct
          from pathlib import Path

          root=Path('.')
          geo=Path('/tmp/geometry.bin').read_bytes()
          assert len(geo)==231604
          assert hashlib.sha256(geo).hexdigest()=='bbdbf940fd629311ddd5fbb7224256c2cd963ec49141abf5e29a4e89ec2806c9'

          texture_specs=[
              ('normal','assets/models/shields/round-wooden-shield-textures/normal.jpg.b64',5528,'5a656d1e404a2b02fe2caa6c032daa7d3c1f711c1c81f3cffbe73403efa36220'),
              ('basecolor','assets/models/shields/round-wooden-shield-textures/basecolor.jpg.b64',17079,'101d884733e850625da37d3d629b5a8cd070785c2707069c081d1209de5f1fbd'),
              ('rm','assets/models/shields/round-wooden-shield-textures/roughness-metallic.jpg.b64',14372,'e9c04df10678786d7dc8eb39f517059a78f7a3a76e1059e710a0533593db34f8')
          ]
          textures=[]
          for _,path,size,sha in texture_specs:
              data=base64.b64decode((root/path).read_text().strip())
              assert len(data)==size,(path,len(data),size)
              assert hashlib.sha256(data).hexdigest()==sha
              textures.append(data)

          views=[
              {'buffer':0,'byteLength':67776,'byteOffset':0,'target':34962},
              {'buffer':0,'byteLength':67776,'byteOffset':67776,'target':34962},
              {'buffer':0,'byteLength':45184,'byteOffset':135552,'target':34962},
              {'buffer':0,'byteLength':50868,'byteOffset':180736,'target':34963},
          ]
          parts=[geo]
          offset=len(geo)
          for data in textures:
              pad=(-offset)%4
              if pad:
                  parts.append(b'\0'*pad)
                  offset+=pad
              views.append({'buffer':0,'byteLength':len(data),'byteOffset':offset})
              parts.append(data)
              offset+=len(data)
          binary=b''.join(parts)

          gltf={
            'asset':{'generator':'Adventure Party web derivative preserving uploaded shield geometry','version':'2.0'},
            'scene':0,
            'scenes':[{'name':'Scene','nodes':[0]}],
            'nodes':[{'mesh':0,'name':'tripo_node_ff283d5d-35e7-4508-8a96-4b7064dabda8'}],
            'materials':[{
              'name':'tripo_mat_ff283d5d-35e7-4508-8a96-4b7064dabda8',
              'normalTexture':{'index':0},
              'pbrMetallicRoughness':{
                'baseColorTexture':{'index':1},
                'metallicRoughnessTexture':{'index':2}
              }
            }],
            'meshes':[{
              'name':'tripo_mesh_ff283d5d-35e7-4508-8a96-4b7064dabda8',
              'primitives':[{'attributes':{'POSITION':0,'NORMAL':1,'TEXCOORD_0':2},'indices':3,'material':0}]
            }],
            'textures':[{'sampler':0,'source':0},{'sampler':0,'source':1},{'sampler':0,'source':2}],
            'images':[
              {'bufferView':4,'mimeType':'image/jpeg','name':'round_wooden_shield_3d_model_normal'},
              {'bufferView':5,'mimeType':'image/jpeg','name':'round_wooden_shield_3d_model_basecolor'},
              {'bufferView':6,'mimeType':'image/jpeg','name':'round_wooden_shield_3d_model_rm'}
            ],
            'accessors':[
              {'bufferView':0,'componentType':5126,'count':5648,'max':[0.4998169541358948,1,0.12459565699100494],'min':[-0.4998169541358948,0,-0.12459565699100494],'type':'VEC3'},
              {'bufferView':1,'componentType':5126,'count':5648,'type':'VEC3'},
              {'bufferView':2,'componentType':5126,'count':5648,'type':'VEC2'},
              {'bufferView':3,'componentType':5123,'count':25434,'type':'SCALAR'}
            ],
            'bufferViews':views,
            'samplers':[{'magFilter':9729,'minFilter':9987}],
            'buffers':[{'byteLength':len(binary)}]
          }

          json_bytes=json.dumps(gltf,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          json_bytes+=b' '*((-len(json_bytes))%4)
          binary+=b'\0'*((-len(binary))%4)
          total=12+8+len(json_bytes)+8+len(binary)
          blob=(
              struct.pack('<4sII',b'glTF',2,total)
              +struct.pack('<II',len(json_bytes),0x4e4f534a)+json_bytes
              +struct.pack('<II',len(binary),0x004e4942)+binary
          )
          expected_size=270460
          expected_sha='82d907b584f88c2620f80148a1fd57d81ea07f3260bd6be0a4eb01edda6791df'
          assert len(blob)==expected_size,(len(blob),expected_size)
          assert hashlib.sha256(blob).hexdigest()==expected_sha

          out=root/'assets/models/shields/round-wooden-shield.glb'
          out.write_bytes(blob)
          print(f'wrote {out}: {len(blob)} bytes {expected_sha}')
          PY

      - name: Commit verified asset and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rev72-transfer
          rm -f .github/workflows/rebuild-rev72-shield.yml
          rm -f assets/models/shields/round-wooden-shield-textures/*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rev 71: restore uploaded wooden shield geometry"
          git push origin HEAD:fix/rev72-original-wooden-shield
