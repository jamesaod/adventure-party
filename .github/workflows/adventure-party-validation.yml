name: Adventure Party Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check game JavaScript syntax
        run: node --check js/adventure-party.js

      - name: Check validator syntax
        run: node --check scripts/validate-repo.mjs

      - name: Validate repository structure and assets
        run: node scripts/validate-repo.mjs
