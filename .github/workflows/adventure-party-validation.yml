name: Adventure Party Validation

on:
  pull_request:
    branches:
      - main
      - candidate
  push:
    branches:
      - main
      - candidate

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check game JavaScript syntax
        run: |
          node --check js/adventure-party.js
          node --check js/game-script-loader.mjs
          node scripts/test-game-script-loader.mjs
          node scripts/test-battlefield-font.mjs
          node scripts/test-combat-info-panel.mjs
          node scripts/test-quick-command.mjs

      - name: Validate 3D studio projection and VGA rendering
        run: |
          node --check js/3d-studio.mjs
          node --check js/warrior-recolor.mjs
          node --check js/studio-core.mjs
          node --check js/studio-geometry.mjs
          node --check js/studio-capture.mjs
          node --check js/studio-animations.mjs
          node --check js/studio-equipment.mjs
          node --check js/mixamo-retarget.mjs
          node --check js/item-catalog.mjs
          node --check js/humanoid-animation-catalog.mjs
          node --check js/studio-shield.mjs
          node --check js/studio-skinning.mjs
          node --check js/studio-orc-native-bind.mjs
          node --check js/studio-qa-pack.mjs
          node --check js/mob-appearance.mjs
          node --check js/mob-appearance-runtime.mjs
          node --check js/combat-pose-recipe.mjs
          node --check js/combat-mob-renderer.mjs
          node --check js/combat-weapon-mount.mjs
          node --check js/sprite-outline.mjs
          node --check js/weapon-pose-profile-export.mjs
          node --check js/studio-weapon-pose-panel.mjs
          node scripts/test-3d-studio.mjs
          node scripts/test-studio-geometry.mjs
          node scripts/test-studio-animations.mjs
          node scripts/test-fbx-animations.mjs
          node scripts/test-blond-scale-mail-model.mjs
          node scripts/test-male-orc-model.mjs
          node scripts/test-orc-leader-model.mjs
          node scripts/test-orc-female-shaman-model.mjs
          node scripts/test-orc-female-shaman-v2-model.mjs
          node scripts/test-studio-batch176.mjs
          node scripts/test-studio-equipment.mjs
          node scripts/test-studio-weapon-sets.mjs
          node scripts/test-studio-casting-captures.mjs
          node scripts/test-studio-sprite-regressions.mjs
          node scripts/test-studio-grip-sliders.mjs
          node scripts/test-orc-sword-profile.mjs
          node scripts/test-studio-ui-cleanup.mjs
          node scripts/test-mixamo-retarget.mjs
          node scripts/test-orc-retarget-comparison.mjs
          node scripts/test-orc-anatomical-aim.mjs
          node scripts/test-orc-full-anatomical-qa.mjs
          node scripts/test-blender-orc-turns.mjs
          node scripts/test-item-catalog.mjs
          node scripts/test-humanoid-animation-catalog.mjs
          node scripts/test-mob-appearance.mjs
          node scripts/test-mob-appearance-runtime.mjs
          node scripts/test-combat-mob-renderer.mjs
          node scripts/test-combat-equipment-refresh.mjs
          node scripts/test-combat-capture-parity.mjs
          node scripts/test-combat-outline.mjs
          node scripts/test-carl-ual2.mjs
          node scripts/test-carl-ual2-two-handed-audition.mjs
          node scripts/test-orc-ual2.mjs
          node scripts/test-orc-skinning.mjs
          node scripts/test-orc-native-bind.mjs
          node scripts/test-studio-qa-pack.mjs
          node scripts/test-combat-inventory-ui.mjs
          node scripts/test-combat-roster-setup.mjs

      - name: Require exact repository New Carl / New Orc binary models before release
        run: node scripts/test-new-tripo-assets.mjs
          node scripts/test-woman-warrior-assets.mjs
          node scripts/test-warrior-recolor.mjs
          node scripts/test-cleric-phase-one.mjs
          node scripts/test-priest-spells-phase-one.mjs
          node --check js/priest-spells.js

      - name: Validate sprite capture packages and asset imports
        run: |
          node --check js/sprite-layouts.mjs
          node --check js/sprite-set-core.mjs
          node --check js/sprite-set-runtime.mjs
          node --check js/sprite-set-store.mjs
          node --check scripts/import-sprite-set.mjs
          node scripts/test-sprite-set-package.mjs
          node scripts/import-sprite-set.mjs --validate

      - name: Validate six-direction combat poses
        run: node scripts/test-directional-sprites.mjs

      - name: Validate multi-hex studio footprints and MOB assignments
        run: node scripts/test-studio-footprints.mjs

      - name: Validate direct studio return after combat tests
        run: node scripts/test-studio-combat-exit.mjs

      - name: Validate embedded equipment texture colors
        run: |
          python -m pip install "Pillow>=11,<13"
          python scripts/test-spear-texture.py
          python scripts/test-recurve-bow.py
          python scripts/test-sling-asset.py
          python scripts/test-crossbow-asset.py
          python scripts/test-equipment-batch-assets.py

      - name: Check Blender pipeline Python syntax
        run: python -m py_compile scripts/blender_repair_orc_turns.py scripts/import-male-orc.py scripts/import-orc-leader.py scripts/import-orc-female-shaman.py scripts/import-orc-female-shaman-v2.py scripts/generate-axe-stance-reference.py

      - name: Validate reusable pose libraries and MOB authoring
        run: |
          node --check js/mob-creator.mjs
          node --check js/studio-pose-library.mjs
          node scripts/test-mob-authoring.mjs
          node --check js/action-capture-groups.mjs
          node scripts/test-shared-action-captures.mjs
          node --check js/studio-workspace-codec.mjs
          node scripts/test-studio-workspace-codec.mjs
          node --check js/studio-capture-export.mjs
          node scripts/test-studio-capture-export.mjs
          node --check js/studio-pose-library.mjs
          node scripts/test-studio-unified-capture.mjs

      - name: Check validator syntax
        run: node --check scripts/validate-repo.mjs

      - name: Validate unit sun shadows
        run: |
          node --check js/unit-sun-shadow.mjs
          node --check js/ground-shadow-geometry.mjs
          node scripts/test-ground-shadow-geometry.mjs
          node scripts/test-unit-sun-shadow.mjs

      - name: Validate repository structure and assets
        run: node scripts/validate-repo.mjs
