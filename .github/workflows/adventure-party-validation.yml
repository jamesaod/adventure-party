name: Adventure Party Validation

on:
  pull_request:
    branches:
      - main
      - candidate
  push:
    branches:
      - main
      - candidate

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check game JavaScript syntax
        run: node --check js/adventure-party.js

      - name: Validate 3D studio projection and VGA rendering
        run: |
          node --check js/3d-studio.mjs
          node --check js/studio-core.mjs
          node --check js/studio-capture.mjs
          node scripts/test-3d-studio.mjs

      - name: Validate sprite capture packages and asset imports
        run: |
          node --check js/sprite-set-core.mjs
          node --check js/sprite-set-runtime.mjs
          node --check js/sprite-set-store.mjs
          node --check scripts/import-sprite-set.mjs
          node scripts/test-sprite-set-package.mjs
          node scripts/import-sprite-set.mjs --validate

      - name: Validate six-direction combat poses
        run: node scripts/test-directional-sprites.mjs

      - name: Check validator syntax
        run: node --check scripts/validate-repo.mjs

      - name: Validate repository structure and assets
        run: node scripts/validate-repo.mjs
