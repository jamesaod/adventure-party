name: Assemble Woman Warrior GLB
on:
  push:
    branches:
      - dev/candidate-rev-122-woman-warrior-full17
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble validated GLB bytes and clean staging
        shell: bash
        run: |
          set -euo pipefail
          out="assets/models/humans/woman-warrior/mixamo-sword-shield-full-17/woman-warrior-mixamo-sword-shield-full-17.glb"
          mkdir -p "$(dirname "$out")"
          cat tmp/woman-warrior-pack/part-*.b64 | base64 --decode > "$out"
          echo "2c0064194f6c201dd8c379d915d3195f0178f28d2e8ee35beb7394aeb77adea5  $out" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path("assets/models/humans/woman-warrior/mixamo-sword-shield-full-17/woman-warrior-mixamo-sword-shield-full-17.glb")
          b=p.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          n=struct.unpack_from('<I',b,12)[0]
          doc=json.loads(b[20:20+n])
          assert len(doc['animations'])==17 and len(doc['skins'][0]['joints'])==65
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r tmp/woman-warrior-pack
          git rm .github/workflows/stage-woman-warrior-asset.yml
          git add "$out"
          git commit -m "Assemble verified 17-clip Warrior GLB from transfer chunks"
          git push origin HEAD:dev/candidate-rev-122-woman-warrior-full17
